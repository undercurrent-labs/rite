# Canonical glyphs and ASCII aliases for Rite v1

[[glyph]]
canonical = "◆"
ascii = ["def"]
token = "Def"
meaning = "Declaration"

[[glyph]]
canonical = "←"
ascii = ["<-"]
token = "Bind"
meaning = "Immutable binding"

[[glyph]]
canonical = "↢"
ascii = ["<~"]
token = "BindMut"
meaning = "Mutable binding"

[[glyph]]
canonical = "→"
ascii = ["->"]
token = "Arrow"
meaning = "Pipeline or match branch"

[[glyph]]
canonical = "^"
ascii = ["return"]
token = "Return"
meaning = "Explicit return or yield"

[[glyph]]
canonical = "?"
ascii = ["if"]
token = "If"
meaning = "Conditional (prefix) / try unwrap (postfix)"

[[glyph]]
canonical = "~"
ascii = ["match"]
token = "Match"
meaning = "Pattern match"

[[glyph]]
canonical = "!"
ascii = ["do"]
token = "Effect"
meaning = "Perform effect"

[[glyph]]
canonical = "@"
ascii = ["host."]
token = "Host"
meaning = "Host capability namespace"

[[glyph]]
canonical = "#"
ascii = [":"]
token = "Atom"
meaning = "Atom prefix"

[[glyph]]
canonical = "⟦"
ascii = ["[["]
token = "BlockOpen"
meaning = "Executable block open"

[[glyph]]
canonical = "⟧"
ascii = ["]]"]
token = "BlockClose"
meaning = "Executable block close"

[[glyph]]
canonical = "⟨"
ascii = ["<<"]
token = "RecordOpen"
meaning = "Record literal open"

[[glyph]]
canonical = "⟩"
ascii = [">>"]
token = "RecordClose"
meaning = "Record literal close"

[[glyph]]
canonical = "∈"
ascii = ["in"]
token = "In"
meaning = "Membership"

[[glyph]]
canonical = "∉"
ascii = ["not in"]
token = "NotIn"
meaning = "Non-membership"

[[glyph]]
canonical = "??"
ascii = ["??"]
token = "Coalesce"
meaning = "Null/default coalescing"

[[glyph]]
canonical = ":="
ascii = [":="]
token = "Assign"
meaning = "Mutable assignment"

[[glyph]]
canonical = ".."
ascii = [".."]
token = "Rest"
meaning = "Rest in patterns; spread in record literals (`⟨..base, k: v⟩`, sugar for `+`)"

[[glyph]]
canonical = ":"
ascii = ["else"]
token = "Colon"
meaning = "Else branch of `?` / `if` (both spellings parse in either dialect)"
