# Reserved keywords in Rite v1 (ASCII forms and special words)
#
# This list is checked against the lexer's own `keyword_or_ident` by
# `cargo test -p rite-cli --test editor_grammar_sync`. It previously listed
# `expect`, `expect_error`, `expect_match` and `fail` — `expect` and `fail`
# are builtin functions and the other two never existed — while omitting the
# sugar pack, which is reserved.

keywords = [
  "def",
  "return",
  "if",
  "else",
  "match",
  "do",
  "in",
  "not",
  "and",
  "or",
  "xor",
  "true",
  "false",
  "none",
  "use",
  "as",
  "pub",
  "item",
  "room",
  "world",
  "test",
  "ok",
  "err",
  "some",
  "for",
  "while",
  "loop",
  "break",
  "continue",
  "unless",
  "say",
  "GET",
  "POST",
  "PUT",
  "PATCH",
  "DELETE",
  "HEAD",
  "OPTIONS",
]

# Soft keywords: meaningful to the parser in context, but lexed as identifiers,
# so they stay usable as ordinary names.
soft_keywords = [
  "on",
  "reveal",
  "exits",
  "text",
  "name",
  "weight",
  "tags",
]
