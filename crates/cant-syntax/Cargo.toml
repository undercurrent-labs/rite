[package]
name = "cant-syntax"
# Cant's own version, not the workspace's: it is a separate language with its own
# vocabulary and its own compatibility story. See ADR 0001, Amendment 2.
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Operator manifest, lexer, parser, and AST for Cant"

[dependencies]
rite-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
