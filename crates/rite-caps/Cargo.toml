[package]
name = "rite-caps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rite host capabilities and permissions"

[dependencies]
rite-core = { workspace = true }
rite-runtime = { workspace = true }
rite-sem = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
ctrlc = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { workspace = true }
csv = "1"

# Outbound HTTP (`@http.get`/`post`/`request`). Not built for wasm32 — the browser host
# has no socket layer; those calls return a capability error there, as `@db` does.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[features]
default = ["duckdb"]
# Native DuckDB host for @db (off on wasm / when linking is undesirable).
duckdb = ["dep:duckdb"]

[dependencies.duckdb]
version = "1.10505.0"
optional = true
features = ["bundled"]

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
