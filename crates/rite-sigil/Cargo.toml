[package]
name = "rite-sigil"
# Sigil's own version. It renders Cant graphs and will render others; tying it to
# either language's number would make a renderer release imply a language one.
# Same reasoning as ADR 0001, Amendment 2.
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deterministic semantic renderer: a program's topology as a ritual artifact"
repository.workspace = true

[features]
# PNG rasterisation, off by default — the same pattern `rite-render` uses and for
# the same reason: the browser build must not pull a rasteriser and a font stack
# it cannot use. `cant-cli` turns it on.
png = ["dep:rite-render"]

# The dependency list is the architecture, and `tests/boundaries.rs` reads this
# file to prove it. Nothing here parses a language, executes anything, opens a
# file, or knows what Cant is:
#
#   * no `rite-runtime`, `rite-caps`, `rite-compiler`  — ADR 0003, Sigil is not a runtime
#   * no `cant-syntax`, `cant-sem`, `cant`             — ADR 0006, Sigil takes a normalized graph
#   * no `rite-syntax`, `rite-sem`                     — the same rule from the other side
#
# `rite-core` is here for `Span` alone: a diagnostic that cannot point at the
# source it came from is a diagnostic nobody can act on, and re-declaring a byte
# range would mean two span types that must agree forever.
[dependencies]
rite-core = { workspace = true }
# PNG only. `rite-render::svg_to_png` is arbitrary SVG to PNG — the part of that
# crate that was never about Rite source — so this is reuse of audited behaviour
# rather than a shared abstraction bent to fit two renderers. Path form with
# explicit `default-features = false`, because cargo ignores that on a workspace
# dependency whose table does not specify it, which is how a wasm32 build once
# acquired axum and failed inside `mio`.
rite-render = { path = "../rite-render", optional = true, default-features = false, features = ["png"] }
# Pure-Rust transcendental functions, so the same angle is the same coordinate
# on every platform. The system libm's sin/cos/atan2 differ from glibc's in the
# last bit on some inputs, which made scene goldens platform-dependent.
libm = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
