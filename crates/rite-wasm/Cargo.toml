[package]
name = "rite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser-facing Rite API (WASM-ready)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rite-core = { workspace = true }
rite-syntax = { workspace = true }
rite-sem = { workspace = true }
rite-fmt = { workspace = true }
# Default features only: `png` would pull a rasteriser and a system font stack
# into a browser build that can use neither. Studio takes the SVG to a canvas.
rite-render = { workspace = true }
rite-analysis = { workspace = true }
# Pure evaluator (wasm-safe; no Tokio/mio)
rite-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Capability host. Path rather than `workspace = true`, and deliberately: cargo
# ignores `default-features = false` on a workspace dependency whose table does
# not specify it, so the workspace form would pull axum, hyper and tokio into a
# wasm32 build and fail inside `mio`. Without `native` this is the pure half —
# @json, @csv, @crypto, @regex, @store, @random, @game.
rite-caps = { path = "../rite-caps", default-features = false }
# Native full stack (HTTP + process + codegen)
rite-compiler = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# WASM glue
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", optional = true, features = ["js"] }

[features]
default = ["native"]
native = ["rite-compiler", "rite-caps/native", "rite-caps/duckdb", "rite-caps/proto", "tokio"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook", "getrandom"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
