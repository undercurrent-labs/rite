[package]
name = "cant-sem"
# Cant's own version, not the workspace's: it is a separate language with its own
# vocabulary and its own compatibility story. See ADR 0001, Amendment 2.
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cant graph IR, validation, lowering to Rite, and source maps"

[dependencies]
cant-syntax = { workspace = true }
rite-core = { workspace = true }
# The Sigil adapter. This edge is `cant-* -> rite-*`, which ADR 0001 allows and
# ADR 0006 requires: `rite-sigil` may not know what Cant is, so the crate that
# knows both shapes has to be this one.
rite-sigil = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
