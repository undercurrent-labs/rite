# Build installable CLI binaries and publish a GitHub Release.
# Trigger: push tag v*  (e.g. git tag v0.1.0 && git push origin v0.1.0)
# Or: Actions → Release binaries → Run workflow
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0). Creates/uses this tag name for assets."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (servers, most laptops, WSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          # Both Mac triples on Apple Silicon runners (macos-13 Intel is scarce/queued forever on free)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Host triple is always installed; matrix.target may be a cross triple (Intel Mac on ARM runners).
          targets: ${{ matrix.target }}

      - name: Ensure rustup target present
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          rustup show
          rustup target list --installed
          if [[ "$HOST" == "${{ matrix.target }}" ]]; then
            cargo build -p rite-cli -p rite-lsp --release
            BIN=target/release
          else
            # e.g. x86_64-apple-darwin on aarch64 macos-latest
            cargo build -p rite-cli -p rite-lsp --release --target "${{ matrix.target }}"
            BIN=target/${{ matrix.target }}/release
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          STAGE="rite-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "${BIN}/rite" "dist/${STAGE}/rite"
          cp "${BIN}/rite-lsp" "dist/${STAGE}/rite-lsp"
          chmod +x "dist/${STAGE}/rite" "dist/${STAGE}/rite-lsp"
          strip "dist/${STAGE}/rite" 2>/dev/null || true
          strip "dist/${STAGE}/rite-lsp" 2>/dev/null || true
          tar -C dist -czf "dist/rite-${TARGET}.tar.gz" "${STAGE}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "rite-${TARGET}.tar.gz" > "SHA256SUMS-${TARGET}")
          else
            (cd dist && shasum -a 256 "rite-${TARGET}.tar.gz" > "SHA256SUMS-${TARGET}")
          fi
          ls -la dist/

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Target = "${{ matrix.target }}"
          $Stage = "rite-$Target"
          $Bin = $env:BIN
          New-Item -ItemType Directory -Force -Path "dist/$Stage" | Out-Null
          Copy-Item "$Bin/rite.exe" "dist/$Stage/rite.exe"
          Copy-Item "$Bin/rite-lsp.exe" "dist/$Stage/rite-lsp.exe"
          # Git Bash has no `zip`; use PowerShell
          Compress-Archive -Path "dist/$Stage" -DestinationPath "dist/rite-$Target.zip" -Force
          $hash = (Get-FileHash "dist/rite-$Target.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/SHA256SUMS-$Target" -Value "$hash  rite-$Target.zip"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rite-${{ matrix.target }}
          path: |
            dist/rite-*
            dist/SHA256SUMS-*

  vscode:
    name: VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: Package VSIX
        run: bash scripts/package-vsix.sh dist/vscode/rite.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: rite-vsix
          path: dist/vscode/rite.vsix

  skill:
    name: Agent skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package skill (relative OUT — same as local gate)
        run: bash scripts/package-skill.sh dist/skill
      - name: Upload skill artifact
        uses: actions/upload-artifact@v5
        with:
          name: rite-skill
          path: |
            dist/skill/rite-agent-skill.tar.gz
            dist/skill/rite-agent-skill.zip
            dist/skill/SHA256SUMS

  # The generated crate is only ever *compiled* here. CI parses it with `syn`, which
  # catches a stray brace or a bad literal in milliseconds but does not type-check — so a
  # lowering that emits well-formed Rust referring to something that does not exist would
  # pass there and break `rite build` for everyone. This is minutes, which is affordable
  # once per tag and was not affordable on every push.
  backend:
    name: Compiled backend end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build + run generated binaries, and diff against the interpreter
        run: cargo test -p rite-compiler -- --ignored --nocapture --test-threads=1

  publish:
    name: Publish GitHub Release
    needs: [build, vscode, skill, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in v*) ;; *) V="v${V}" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing $V"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Assemble dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten platform artifacts
          find artifacts -type f \( -name 'rite-*.tar.gz' -o -name 'rite-*.zip' -o -name 'SHA256SUMS-*' \) -exec cp -v {} dist/ \;
          # Skill bundle
          find artifacts -type f \( -name 'rite-agent-skill.tar.gz' -o -name 'rite-agent-skill.zip' \) -exec cp -v {} dist/ \;
          # VSIX
          find artifacts -type f -name '*.vsix' -exec cp -v {} dist/rite.vsix \;
          # Merge checksums
          cat dist/SHA256SUMS-* 2>/dev/null | sort -k2 > dist/SHA256SUMS || true
          rm -f dist/SHA256SUMS-*
          if command -v sha256sum >/dev/null; then
            (cd dist && for f in rite-agent-skill.tar.gz rite-agent-skill.zip rite.vsix; do
              [[ -f "$f" ]] && sha256sum "$f" >> SHA256SUMS
            done) || true
          fi
          # Version manifest
          cat > dist/version-manifest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "commit": "${{ github.sha }}",
            "repo": "${{ github.repository }}",
            "assets": {
              "skill": "rite-agent-skill.tar.gz",
              "vscode": "rite.vsix"
            }
          }
          EOF
          ls -la dist/
          cat dist/SHA256SUMS || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Rite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
            dist/SHA256SUMS
            dist/version-manifest.json
          body: |
            ## Install (no clone)

            ```bash
            curl -fsSL https://rite.undrc.dev/install | bash
            ```

            Pin a version:

            ```bash
            curl -fsSL https://rite.undrc.dev/install | RITE_VERSION=${{ steps.ver.outputs.version }} bash
            ```

            Binaries install to `~/.local/bin` by default (`rite` + `rite-lsp`).

            ### Agent skill

            ```bash
            rite skill install --target all
            # or download: rite-agent-skill.tar.gz from assets / https://rite.undrc.dev/skill/
            ```

            ### VS Code / Cursor

            ```bash
            rite vscode install
            # or Install from VSIX: rite.vsix
            ```

            See https://rite.undrc.dev/agents

            ### Manual download

            Grab the archive for your platform from the assets below, verify against `SHA256SUMS`, extract, and put `rite` on your `PATH`.

            Docs: https://rite.undrc.dev/docs/installation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs *after* publish, against the binary that was actually released.
  #
  # It cannot block anything — the release is already out — so its job is to tell you to
  # yank or patch. That is still the only way to check the things a pre-publish job
  # structurally cannot: that the archive is not corrupt, that the version baked into the
  # binary matches its tag, and that `rite build` outside a checkout resolves the git
  # dependencies for *this* release rather than a previous one.
  #
  # The pre-publish `backend` job covers the same mechanism against the newest existing
  # tag, which is what makes it runnable before a release. This covers the half that only
  # exists afterwards.
  smoke:
    name: Smoke-test the released binary
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in v*) ;; *) V="v${V}" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download the published Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.ver.outputs.version }}" \
            -R "${{ github.repository }}" \
            -p 'rite-x86_64-unknown-linux-gnu.tar.gz' -D dl
          tar -C dl -xzf dl/rite-x86_64-unknown-linux-gnu.tar.gz
          find dl -type f -name rite -perm -u+x -exec cp {} ./rite \;
          chmod +x ./rite

      - name: The version it reports is the version that was tagged
        run: |
          set -euo pipefail
          REPORTED="v$(./rite version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "tag=${{ steps.ver.outputs.version }} binary=$REPORTED"
          [ "$REPORTED" = "${{ steps.ver.outputs.version }}" ]

      - name: It runs a script
        run: |
          set -euo pipefail
          printf '◆ double(n) ⟦ ^ n * 2 ⟧\n! @console.println(str(double(21)))\n' > smoke.rite
          OUT="$(./rite run smoke.rite)"
          echo "$OUT"
          [ "$OUT" = "42" ]

      # Outside any checkout, so the generated crate must resolve rite-* from git at this
      # release's tag — the path a user who installed a binary actually takes, and the one
      # that cannot be exercised until the tag exists.
      - name: It compiles a script outside a checkout
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cp smoke.rite /tmp/smoke/ && cd /tmp/smoke
          "$GITHUB_WORKSPACE/rite" build smoke.rite --output ./smoke-bin
          OUT="$(./smoke-bin)"
          echo "$OUT"
          [ "$OUT" = "42" ]
