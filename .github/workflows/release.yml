# Build installable CLI binaries and publish a GitHub Release.
# Trigger: push tag v*  (e.g. git tag v0.1.0 && git push origin v0.1.0)
# Or: Actions → Release binaries → Run workflow
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0). Creates/uses this tag name for assets."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (servers, most laptops, WSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          # Both Mac triples on Apple Silicon runners (macos-13 Intel is scarce/queued forever on free)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Host triple is always installed; matrix.target may be a cross triple (Intel Mac on ARM runners).
          targets: ${{ matrix.target }}

      - name: Ensure rustup target present
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          rustup show
          rustup target list --installed
          if [[ "$HOST" == "${{ matrix.target }}" ]]; then
            cargo build -p rite-cli -p rite-lsp --release
            BIN=target/release
          else
            # e.g. x86_64-apple-darwin on aarch64 macos-latest
            cargo build -p rite-cli -p rite-lsp --release --target "${{ matrix.target }}"
            BIN=target/${{ matrix.target }}/release
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          STAGE="rite-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "${BIN}/rite" "dist/${STAGE}/rite"
          cp "${BIN}/rite-lsp" "dist/${STAGE}/rite-lsp"
          chmod +x "dist/${STAGE}/rite" "dist/${STAGE}/rite-lsp"
          strip "dist/${STAGE}/rite" 2>/dev/null || true
          strip "dist/${STAGE}/rite-lsp" 2>/dev/null || true
          tar -C dist -czf "dist/rite-${TARGET}.tar.gz" "${STAGE}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "rite-${TARGET}.tar.gz" > "SHA256SUMS-${TARGET}")
          else
            (cd dist && shasum -a 256 "rite-${TARGET}.tar.gz" > "SHA256SUMS-${TARGET}")
          fi
          ls -la dist/

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Target = "${{ matrix.target }}"
          $Stage = "rite-$Target"
          $Bin = $env:BIN
          New-Item -ItemType Directory -Force -Path "dist/$Stage" | Out-Null
          Copy-Item "$Bin/rite.exe" "dist/$Stage/rite.exe"
          Copy-Item "$Bin/rite-lsp.exe" "dist/$Stage/rite-lsp.exe"
          # Git Bash has no `zip`; use PowerShell
          Compress-Archive -Path "dist/$Stage" -DestinationPath "dist/rite-$Target.zip" -Force
          $hash = (Get-FileHash "dist/rite-$Target.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/SHA256SUMS-$Target" -Value "$hash  rite-$Target.zip"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rite-${{ matrix.target }}
          path: |
            dist/rite-*
            dist/SHA256SUMS-*

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in v*) ;; *) V="v${V}" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing $V"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Assemble dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten artifacts
          find artifacts -type f \( -name 'rite-*.tar.gz' -o -name 'rite-*.zip' -o -name 'SHA256SUMS-*' \) -exec cp -v {} dist/ \;
          # Merge checksums
          cat dist/SHA256SUMS-* | sort -k2 > dist/SHA256SUMS
          rm -f dist/SHA256SUMS-*
          # Version manifest
          cat > dist/version-manifest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "commit": "${{ github.sha }}",
            "repo": "${{ github.repository }}"
          }
          EOF
          ls -la dist/
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Rite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/version-manifest.json
          body: |
            ## Install (no clone)

            ```bash
            curl -fsSL https://rite.undrc.dev/install | sh
            ```

            Pin a version:

            ```bash
            curl -fsSL https://rite.undrc.dev/install | RITE_VERSION=${{ steps.ver.outputs.version }} sh
            ```

            Binaries install to `~/.local/bin` by default (`rite` + `rite-lsp`).

            ### Manual download

            Grab the archive for your platform from the assets below, verify against `SHA256SUMS`, extract, and put `rite` on your `PATH`.

            Docs: https://rite.undrc.dev/docs/installation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
