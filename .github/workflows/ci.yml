name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is opt-in, not gone. It takes ~36 minutes against ~10 for the others and
        # gates nothing anyone is currently shipping on, so it does not run on push or PR.
        # Everything that made it pass — paths written as raw strings, POSIX-only fixtures
        # replaced, separator-neutral assertions, the `bash`-is-really-WSL guard — stays,
        # so turning it back on is one click rather than another afternoon.
        #
        #   Actions → CI → Run workflow      (includes Windows)
        #   gh workflow run ci.yml --ref <branch>
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      # Line endings are pinned by .gitattributes, so the Windows runner does not
      # rewrite every file on checkout and make the generation guard below see the
      # whole tree as modified.
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `cant-sem/tests/dot_renders.rs` pipes its DOT output through Graphviz and
      # requires exit 0 *and* empty stderr. Without `dot` on PATH that test prints
      # a note and returns, so the coverage would silently vanish rather than fail.
      - name: install graphviz
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install graphviz
          else
            sudo apt-get update && sudo apt-get install -y graphviz
          fi
        shell: bash
        if: runner.os != 'Windows'
      - name: fmt
        run: cargo fmt --all -- --check
      # Gate, not advisory: the tree is clippy-clean, so a new warning must fail CI.
      # (The old form combined `--workspace` with `-p rite-wasm --features native`,
      # which cargo rejects, and `continue-on-error` hid that it never ran.)
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # example_ladder integration tests spawn target/debug/rite; Cant's
      # differential harness spawns both target/debug/cant *and* target/debug/rite
      # — without the latter it prints a note and checks nothing.
      - name: build debug CLI
        run: cargo build -p rite-cli -p rite-lsp -p cant-cli
      # `--no-fail-fast`: without it cargo stops at the first failing test binary, so a
      # platform-specific break reports one failure per run. Three consecutive Windows
      # runs each surfaced exactly one more problem — at 36 minutes a run, that is a
      # whole afternoon spent discovering things one machine already knew.
      #
      # Blocking on every platform in the matrix, Windows included. It was advisory while
      # it ran on every push and its failures were all unportable *tests* rather than a
      # broken Rite; now that it only runs when someone asks for it, a masked result would
      # defeat the point of asking. (See the clippy comment above: `continue-on-error` has
      # already hidden a broken step in this file once.)
      - name: test
        run: cargo test --workspace --all-features --no-fail-fast
      # Shells out to scripts/package-*.sh; the release archives are produced on Linux.
      - name: packaging gate (skill archives)
        if: runner.os == 'Linux'
        run: |
          RITE_SKIP_VSIX=1 cargo test -p rite-cli --test packaging -- --nocapture
      - name: build release tools
        run: cargo build -p rite-cli -p rite-lsp -p cant-cli --release
      # The release archive ships `cant`; a binary that does not start is worth
      # catching here rather than in a release.
      - name: cant smoke test
        if: runner.os != 'Windows'
        run: |
          ./target/release/cant version
          ./target/release/cant -e '[1, 2, 3] -> * -> ?{ $ > 1 } -> []'
          ./target/release/cant explain -e '[1, 2] -> * -> []' > /dev/null
      - name: doctests
        if: runner.os != 'Windows'
        run: ./target/release/rite docs check
      # Windows binary lives at a different path and the guard below compares a git
      # diff, so keep the generation check on the platforms that produce releases.
      - name: doctests (windows)
        if: runner.os == 'Windows'
        run: .\target\release\rite.exe docs check
      # `docs build` writes the agent bundle *and* the generated reference. The
      # site publishes docs/generated/{capabilities,cli}.md, so those are tracked
      # and the guard below fails if a capability or a CLI flag changed without
      # the published page being regenerated.
      - name: agent bundle + generated reference
        if: runner.os == 'Linux'
        run: ./target/release/rite docs build
      # Regenerating must not rewrite tracked sources. This caught SKILL.md being
      # truncated to zero bytes by an in-place bundle regeneration.
      - name: tracked files unchanged by generation
        if: runner.os == 'Linux'
        run: |
          if ! git diff --quiet -- skills/ docs/ examples/ apps/; then
            echo "::error::generation modified tracked files:"
            git --no-pager diff --stat -- skills/ docs/ examples/ apps/
            exit 1
          fi
          test -s skills/rite/SKILL.md
      - name: upload binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: rite-binaries-${{ matrix.os }}
          path: |
            target/release/rite
            target/release/rite-lsp
          if-no-files-found: warn

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        # Pinned: the action's "latest" lookup goes through the GitHub API and,
        # rate-limited, once fell back to wasm-pack v0.9.1 — which predates
        # workspace-inherited manifest keys and failed the build on a manifest
        # it could not parse.
        with:
          version: "v0.15.0"
      - uses: Swatinem/rust-cache@v2
      - name: build wasm
        run: bash scripts/build-wasm.sh
      # The browser capability host, run rather than only compiled. `rite-wasm`
      # without `native` builds for the host too, so the same `rite-caps` half a
      # tab gets — @json, @csv, @crypto, @regex, @store — is testable here, as is
      # `@fs` being refused by name. The workspace job cannot cover it: it builds
      # every feature.
      - name: test browser capability host
        run: cargo test -p rite-wasm --no-default-features
      - name: upload wasm
        uses: actions/upload-artifact@v5
        with:
          name: rite-wasm
          path: apps/rite-studio/public/wasm

  studio:
    name: Studio
    runs-on: ubuntu-latest
    # `vscode` too: the site links a /vscode/rite.vsix mirror only when the packaged
    # extension is really in dist, so the artifact has to exist before this builds.
    needs: [wasm, vscode]
    steps:
      - uses: actions/checkout@v5
      # Must match package.json "packageManager": "pnpm@9.0.0" exactly
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/download-artifact@v5
        with:
          name: rite-wasm
          path: apps/rite-studio/public/wasm
      - uses: actions/download-artifact@v5
        with:
          name: rite-vsix
          path: apps/rite-web/public/vscode
      - name: install & build product site
        run: |
          set -euo pipefail
          pnpm install
          # Gate, not advisory: `typecheck` was broken for both apps (vue-tsc 1.x
          # against TypeScript 5.9 crashed on startup) and nothing noticed,
          # because the build itself never typechecks.
          pnpm --dir apps/rite-web typecheck
          pnpm --dir apps/rite-studio typecheck
          # studio SPA is pulled into rite-web; build both
          pnpm --dir apps/rite-studio build
          # seed install endpoints + wasm for web
          mkdir -p apps/rite-web/public/wasm
          cp -a apps/rite-studio/public/wasm/. apps/rite-web/public/wasm/ || true
          install -m 644 scripts/install.sh apps/rite-web/public/install.sh
          install -m 644 scripts/install.sh apps/rite-web/public/install
          # Agent skill archives must be real static files (not SPA HTML fallback)
          bash scripts/package-skill.sh apps/rite-web/public/skill
          pnpm --dir apps/rite-web build
          # Fail deploy if skill packages never made it into dist
          test -f apps/rite-web/dist/skill/rite-agent-skill.tar.gz
          test -f apps/rite-web/dist/skill/rite-agent-skill.zip
          test -f apps/rite-web/dist/install.sh || test -f apps/rite-web/dist/install
          file apps/rite-web/dist/skill/rite-agent-skill.zip
          # The site links the VSIX mirror because this job supplied one — so it
          # has to be in dist, and has to be a zip rather than SPA HTML.
          test -f apps/rite-web/dist/vscode/rite.vsix
          file apps/rite-web/dist/vscode/rite.vsix | grep -qiE 'zip|archive'
          ls -la apps/rite-web/dist/skill/ apps/rite-web/dist/vscode/
      - name: upload studio dist
        uses: actions/upload-artifact@v5
        with:
          name: rite-studio-dist
          path: apps/rite-studio/dist
      - name: upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: rite-web-dist
          path: apps/rite-web/dist

  cant-site:
    name: Cant site
    runs-on: ubuntu-latest
    # No `needs:` — the Cant site embeds no WASM engine and mirrors no VSIX, so it
    # depends on nothing the other jobs produce. Keeping it independent is the
    # point: ADR 0001 requires that Cant be removable without touching Rite, and a
    # build graph that couples them would quietly make that false.
    steps:
      - uses: actions/checkout@v5
      # Studio runs the real engine, so this job builds `cant-wasm` the same way
      # the WASM job builds Rite's.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        # Pinned: the action's "latest" lookup goes through the GitHub API and,
        # rate-limited, once fell back to wasm-pack v0.9.1 — which predates
        # workspace-inherited manifest keys and failed the build on a manifest
        # it could not parse.
        with:
          version: "v0.15.0"
      - uses: Swatinem/rust-cache@v2
      # Must match package.json "packageManager": "pnpm@9.0.0" exactly
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - name: install & build cant site
        run: |
          set -euo pipefail
          pnpm install
          # Gate, not advisory — same reasoning as the rite-web typecheck above.
          pnpm --dir apps/cant-web typecheck
          bash scripts/build-cant-site.sh
      - name: upload cant dist
        uses: actions/upload-artifact@v5
        with:
          name: cant-web-dist
          path: apps/cant-web/dist

  sigil-site:
    name: Sigil site
    runs-on: ubuntu-latest
    # No `needs:` — the Sigil site builds its own WASM and mirrors nothing the
    # other jobs produce. Independent for the same reason the Cant site is: it
    # must be removable without touching anything else.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        # Pinned: the action's "latest" lookup goes through the GitHub API and,
        # rate-limited, once fell back to wasm-pack v0.9.1 — which predates
        # workspace-inherited manifest keys and failed the build on a manifest
        # it could not parse.
        with:
          version: "v0.15.0"
      - uses: Swatinem/rust-cache@v2
      # Must match package.json "packageManager": "pnpm@9.0.0" exactly
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - name: install & build sigil site
        run: |
          set -euo pipefail
          pnpm install
          # Gate, not advisory — same reasoning as the other two typechecks.
          pnpm --dir apps/sigil-web typecheck
          pnpm --dir apps/sigil-web test
          bash scripts/build-sigil-site.sh
          # The app loads the engine by URL at runtime, so a build that dropped
          # it is a blank canvas in production rather than a failure here.
          test -f apps/sigil-web/dist/wasm/cant_sigil_wasm_bg.wasm
          test -f apps/sigil-web/dist/index.html
      - name: upload sigil dist
        uses: actions/upload-artifact@v5
        with:
          name: sigil-web-dist
          path: apps/sigil-web/dist

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Root package.json has packageManager=pnpm; don't auto-setup pnpm for this npm job
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: package skill + vsix (same scripts as Release)
        run: bash scripts/check-packaging.sh
      - name: upload vsix
        uses: actions/upload-artifact@v5
        with:
          name: rite-vsix
          path: dist/vscode/rite.vsix
      - name: upload skill
        uses: actions/upload-artifact@v5
        with:
          name: rite-skill
          path: |
            dist/skill-check/rite-agent-skill.tar.gz
            dist/skill-check/rite-agent-skill.zip

  # No deploy job. Both sites go out from `.github/workflows/release.yml`, on the
  # tag, after the GitHub Release is published.
  #
  # They used to deploy on every push to main, which meant the site could describe
  # a release that did not exist: the install one-liner, the version badge and the
  # download links are built from the tree, while the assets they point at only
  # appear when a tag is published. Between a merge and a tag the page named a
  # version nobody could install.
  #
  # The jobs above still *build* both sites on every push and PR, so a broken site
  # fails before it is anywhere near production. Only the publish moved.

  release-manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [rust, wasm, studio]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
      - name: write version manifest
        run: |
          mkdir -p dist
          cat > dist/version-manifest.json <<EOF
          {
            "release": "${{ github.ref_name }}",
            "language_version": "1",
            "formatter_version": "1",
            "lsp_protocol": "3.17",
            "commit": "${{ github.sha }}"
          }
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: version-manifest
          path: dist/version-manifest.json
