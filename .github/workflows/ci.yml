name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Line endings are pinned by .gitattributes, so the Windows runner does not
      # rewrite every file on checkout and make the generation guard below see the
      # whole tree as modified.
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      # Gate, not advisory: the tree is clippy-clean, so a new warning must fail CI.
      # (The old form combined `--workspace` with `-p rite-wasm --features native`,
      # which cargo rejects, and `continue-on-error` hid that it never ran.)
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # example_ladder integration tests spawn target/debug/rite
      - name: build debug CLI
        run: cargo build -p rite-cli -p rite-lsp
      - name: test
        run: cargo test --workspace --all-features
      # Shells out to scripts/package-*.sh; the release archives are produced on Linux.
      - name: packaging gate (skill archives)
        if: runner.os == 'Linux'
        run: |
          RITE_SKIP_VSIX=1 cargo test -p rite-cli --test packaging -- --nocapture
      - name: build release tools
        run: cargo build -p rite-cli -p rite-lsp --release
      - name: doctests
        if: runner.os != 'Windows'
        run: ./target/release/rite docs check
      # Windows binary lives at a different path and the guard below compares a git
      # diff, so keep the generation check on the platforms that produce releases.
      - name: doctests (windows)
        if: runner.os == 'Windows'
        run: .\target\release\rite.exe docs check
      - name: agent bundle
        if: runner.os == 'Linux'
        run: ./target/release/rite docs agent --output skills/rite
      # Regenerating must not rewrite tracked sources. This caught SKILL.md being
      # truncated to zero bytes by an in-place bundle regeneration.
      - name: tracked files unchanged by generation
        if: runner.os == 'Linux'
        run: |
          if ! git diff --quiet -- skills/ docs/ examples/ apps/; then
            echo "::error::generation modified tracked files:"
            git --no-pager diff --stat -- skills/ docs/ examples/ apps/
            exit 1
          fi
          test -s skills/rite/SKILL.md
      - name: upload binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: rite-binaries-${{ matrix.os }}
          path: |
            target/release/rite
            target/release/rite-lsp
          if-no-files-found: warn

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: Swatinem/rust-cache@v2
      - name: build wasm
        run: bash scripts/build-wasm.sh
      - name: upload wasm
        uses: actions/upload-artifact@v5
        with:
          name: rite-wasm
          path: apps/rite-studio/public/wasm

  studio:
    name: Studio
    runs-on: ubuntu-latest
    needs: [wasm]
    steps:
      - uses: actions/checkout@v5
      # Must match package.json "packageManager": "pnpm@9.0.0" exactly
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/download-artifact@v5
        with:
          name: rite-wasm
          path: apps/rite-studio/public/wasm
      - name: install & build product site
        run: |
          set -euo pipefail
          pnpm install
          # studio SPA is pulled into rite-web; build both
          pnpm --dir apps/rite-studio build
          # seed install endpoints + wasm for web
          mkdir -p apps/rite-web/public/wasm
          cp -a apps/rite-studio/public/wasm/. apps/rite-web/public/wasm/ || true
          install -m 644 scripts/install.sh apps/rite-web/public/install.sh
          install -m 644 scripts/install.sh apps/rite-web/public/install
          # Agent skill archives must be real static files (not SPA HTML fallback)
          bash scripts/package-skill.sh apps/rite-web/public/skill
          # Optional VSIX if vscode job artifact present later; placeholder ok
          mkdir -p apps/rite-web/public/vscode
          pnpm --dir apps/rite-web build
          # Fail deploy if skill packages never made it into dist
          test -f apps/rite-web/dist/skill/rite-agent-skill.tar.gz
          test -f apps/rite-web/dist/skill/rite-agent-skill.zip
          test -f apps/rite-web/dist/install.sh || test -f apps/rite-web/dist/install
          file apps/rite-web/dist/skill/rite-agent-skill.zip
          ls -la apps/rite-web/dist/skill/
      - name: upload studio dist
        uses: actions/upload-artifact@v5
        with:
          name: rite-studio-dist
          path: apps/rite-studio/dist
      - name: upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: rite-web-dist
          path: apps/rite-web/dist

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Root package.json has packageManager=pnpm; don't auto-setup pnpm for this npm job
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: package skill + vsix (same scripts as Release)
        run: bash scripts/check-packaging.sh
      - name: upload vsix
        uses: actions/upload-artifact@v5
        with:
          name: rite-vsix
          path: dist/vscode/rite.vsix
      - name: upload skill
        uses: actions/upload-artifact@v5
        with:
          name: rite-skill
          path: |
            dist/skill-check/rite-agent-skill.tar.gz
            dist/skill-check/rite-agent-skill.zip

  deploy:
    name: Deploy Cloudflare
    runs-on: ubuntu-latest
    # `rust` too: never publish the site from a commit whose tests fail.
    needs: [rust, studio]
    # Production site: main pushes + manual runs (not PRs / forks)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in repo Actions secrets."
            exit 1
          fi
          echo "Cloudflare secrets present (values masked)."
      - uses: actions/download-artifact@v5
        with:
          name: rite-web-dist
          path: apps/rite-web/dist
      - name: Verify dist
        run: |
          set -euo pipefail
          test -f apps/rite-web/dist/index.html
          test -f apps/rite-web/dist/install.sh || test -f apps/rite-web/dist/install
          test -f apps/rite-web/dist/skill/rite-agent-skill.tar.gz
          test -f apps/rite-web/dist/skill/rite-agent-skill.zip
          # Must be zip/gzip, not SPA HTML mistaken for a download
          file apps/rite-web/dist/skill/rite-agent-skill.zip | grep -qiE 'zip|archive'
          ! grep -q '<!DOCTYPE html' apps/rite-web/dist/skill/rite-agent-skill.zip
          ls -la apps/rite-web/dist/skill/
          ls -la apps/rite-web/dist | head -25
      - name: Deploy Worker (rite-studio)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/rite-web
          # Match local deploy tooling (assets Workers need modern wrangler)
          wranglerVersion: "4.28.0"
          command: deploy

  release-manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [rust, wasm, studio]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
      - name: write version manifest
        run: |
          mkdir -p dist
          cat > dist/version-manifest.json <<EOF
          {
            "release": "${{ github.ref_name }}",
            "language_version": "1",
            "formatter_version": "1",
            "lsp_protocol": "3.17",
            "commit": "${{ github.sha }}"
          }
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: version-manifest
          path: dist/version-manifest.json
