<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cant</title>
    <meta
      name="description"
      content="Cant is a terminal-typeable, graph-oriented sibling to Rite. Flows, wards, forks, and bounded orbits — lowered to canonical Rite and run on Rite's runtime."
    />
    <link rel="canonical" href="https://cant.rite.foo/" />
    <meta property="og:title" content="Cant" />
    <meta
      property="og:description"
      content="A terminal-typeable, graph-oriented sibling to Rite."
    />
    <!-- Absolute: most scrapers will not resolve a relative og:image, and none
         of them render SVG — hence a PNG, built by `cargo run -p xtask -- cant-og`. -->
    <meta property="og:image" content="https://cant.rite.foo/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://cant.rite.foo/" />
    <meta property="og:site_name" content="Cant" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cant.rite.foo/og.png" />
    <link rel="icon" href="/brand/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
